workflows:
  android-google-play:
    name: Hoop Keys Android Google Play
    max_build_duration: 120
    environment:
      groups:
        - android_signing
      flutter: stable
      java: 17
    scripts:
      - name: Verify Android Firebase app
        script: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('android/app/google-services.json')
          if not path.is_file():
              raise SystemExit('Missing Android Firebase configuration: android/app/google-services.json')
          config = json.loads(path.read_text(encoding='utf-8'))
          packages = {
              client['client_info']['android_client_info']['package_name']
              for client in config.get('client', [])
          }
          if config['project_info']['project_id'] != 'hoop-keys' or 'com.omergames.hoopkeys' not in packages:
              raise SystemExit('Register com.omergames.hoopkeys in the hoop-keys Firebase project and replace google-services.json')
          PY
      - name: Restore upload signing key
        script: |
          set -e
          : "${CM_KEYSTORE_B64:?Missing CM_KEYSTORE_B64 in android_signing}"
          : "${CM_KEY_ALIAS:?Missing CM_KEY_ALIAS in android_signing}"
          : "${CM_KEY_PASSWORD:?Missing CM_KEY_PASSWORD in android_signing}"
          : "${CM_STORE_PASSWORD:?Missing CM_STORE_PASSWORD in android_signing}"
          echo "$CM_KEYSTORE_B64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$CM_STORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF
      - name: Get Flutter packages
        script: flutter pub get
      - name: Flutter analyze
        script: flutter analyze
      - name: Flutter tests
        script: flutter test
      - name: Build signed Android App Bundle
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab

  ios-app-store:
    name: Hoop Keys iOS App Store
    max_build_duration: 120
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        provisioning_profiles:
          - hoopkeys_appstore
        certificates:
          - hoop_keys_distribution
      groups:
        - firebase_ios
      vars:
        BUNDLE_ID: com.omergames.hoopkeys
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Restore iOS Firebase config
        script: |
          if [ -n "$IOS_FIREBASE_PLIST_B64" ]; then
            echo "$IOS_FIREBASE_PLIST_B64" | base64 --decode > ios/Runner/GoogleService-Info.plist || \
            echo "$IOS_FIREBASE_PLIST_B64" | base64 -D > ios/Runner/GoogleService-Info.plist
          fi
          if [ ! -f ios/Runner/GoogleService-Info.plist ]; then
            echo "Missing ios/Runner/GoogleService-Info.plist. Add IOS_FIREBASE_PLIST_B64 to the firebase_ios variable group."
            exit 1
          fi
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods
        script: |
          find ios -name "Podfile" -execdir pod install \;
      - name: Flutter analyze
        script: |
          flutter analyze
      - name: Flutter tests
        script: |
          flutter test
      - name: Build signed IPA
        script: |
          BUILD_NUMBER=${PROJECT_BUILD_NUMBER:-1}
          flutter build ipa --release \
            --build-name=1.1.0 \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
